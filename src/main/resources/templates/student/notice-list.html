<!DOCTYPE html>
<!--
  学生端·班级公告列表（Batch 5 视图层，仅 ROLE_STUDENT，只读）。
  班级ID一律取自登录态（先 GET /api/auth/me 拿 clazzId，再按该班级调
  GET /api/common/notice/clazz/{clazzId}）——前端不输入班级ID，Service 层
  还会再校验"学生只能看本班公告"，双重防越权。置顶公告由后端排在最前。
-->
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('班级公告')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('student-notice')}"></nav>

<main class="hw-main">
    <div class="container py-4">
        <div class="card">
            <div class="card-header bg-white">
                <h1 class="h5 mb-0">班级公告</h1>
            </div>
            <div class="card-body">
                <!-- 公告卡片列表（数据来自 /api/common/notice/clazz/{本人班级}） -->
                <div id="notice-list">
                    <div class="text-muted small">加载中…</div>
                </div>
                <div class="hw-empty d-none" id="empty-tip">班级暂无公告。</div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts(false)}"></th:block>
<script>
    $(function () {
        // 第一步：取本人登录态中的班级ID（身份一律来自服务端，前端无法伪造）
        HW.whoAmI().done(function (me) {
            if (!me || !me.clazzId) {
                $('#notice-list').html('<div class="text-muted">无法确定班级，请重新登录。</div>');
                return;
            }
            // 第二步：按班级拉公告（Service 层再次校验"学生限本班"）
            HW.get('/api/common/notice/clazz/' + me.clazzId).done(renderNotices);
        });
    });

    /** 渲染公告列表：置顶在前（后端已排序），正文完整展示 */
    function renderNotices(list) {
        var $box = $('#notice-list').empty();
        $('#empty-tip').toggleClass('d-none', list && list.length > 0);
        if (!list || list.length === 0) { return; }
        $.each(list, function (i, n) {
            var topBadge = n.isTop === 1 ? '<span class="badge bg-danger me-1">置顶</span>' : '';
            var card =
                '<div class="card mb-3">' +
                '<div class="card-body">' +
                '<h2 class="h6 mb-1">' + topBadge + HW.esc(n.title) + '</h2>' +
                '<div class="small text-muted mb-3">' + HW.esc(n.publisherName) +
                ' 发布于 ' + HW.fmtDateTime(n.createTime) + '</div>' +
                '<div style="white-space:pre-wrap;word-break:break-word">' + HW.esc(n.content) + '</div>' +
                '</div></div>';
            $box.append(card);
        });
    }
</script>
</body>
</html>
