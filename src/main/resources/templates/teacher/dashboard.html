<!DOCTYPE html>
<!--
  教师端·教学看板页（Batch 5 视图层，仅 ROLE_TEACHER，加载 ECharts）。
  两个图表的数据源均为教师端只读接口，归属校验在 Service 层（仅限本人授课班级）：
  1) 月度提交趋势折线   GET /api/teacher/clazz/{clazzId}/trend?months=N（1-24）
     —— MonthlyStatVO 列表（statMonth/avgSubmitRate/avgScore/passRate），
     无已发布成绩的月份 avgScore/passRate 为 null，折线自动断开；
  2) 知识点得分雷达     GET /api/teacher/clazz/{clazzId}/radar
     —— KnowledgeRadarVO 列表（knowledgeTag/avgScoreRate/gradedCount），
     按已批改作业按知识点标签聚合的平均得分率（百分制），无样本时为空列表。
  班级下拉来自 GET /api/common/clazz/options（教师只返回自己授课班级），
  页面本身不访问数据库，与 PageController"只做 URL->模板映射"的设计一致。
-->
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('教学看板')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('teacher-dashboard')}"></nav>

<main class="hw-main">
    <div class="container py-4">
        <!-- ==================== 筛选条：班级 + 统计月数 ==================== -->
        <div class="card mb-3">
            <div class="card-body d-flex flex-wrap align-items-center gap-3">
                <label class="form-label mb-0 small fw-semibold" for="clazz-select">授课班级</label>
                <select class="form-select form-select-sm w-auto" id="clazz-select">
                    <!-- 由脚本填充（仅限本人授课班级） -->
                </select>
                <label class="form-label mb-0 small fw-semibold" for="months-select">统计月数</label>
                <select class="form-select form-select-sm w-auto" id="months-select">
                    <option value="6" selected>最近 6 个月</option>
                    <option value="12">最近 12 个月</option>
                    <option value="24">最近 24 个月</option>
                </select>
                <button class="btn btn-sm btn-primary" id="refresh-btn" type="button">刷新看板</button>
                <span class="small text-muted ms-auto">
                    趋势由定时任务按月生成；雷达按已批改作业实时聚合——结论仅供参考，样本量见右侧明细。
                </span>
            </div>
        </div>

        <div class="row g-4">
            <!-- ==================== 左栏：月度提交趋势折线（双 Y 轴） ==================== -->
            <div class="col-lg-7">
                <div class="card">
                    <div class="card-header bg-white">
                        <h1 class="h6 mb-0">月度提交趋势（提交率 / 及格率 / 平均分）</h1>
                    </div>
                    <div class="card-body">
                        <div class="hw-chart hw-chart-tall" id="trend-chart"></div>
                        <div class="hw-empty d-none" id="trend-empty">
                            该班级暂无月度统计记录——趋势由每日定时任务生成，新班级需等待首个统计周期。
                        </div>
                    </div>
                </div>
            </div>

            <!-- ==================== 右栏：知识点得分雷达 + 样本明细 ==================== -->
            <div class="col-lg-5">
                <div class="card mb-3">
                    <div class="card-header bg-white">
                        <h2 class="h6 mb-0">知识点得分雷达（百分制平均得分率）</h2>
                    </div>
                    <div class="card-body">
                        <div class="hw-chart" id="radar-chart"></div>
                        <div class="hw-empty d-none" id="radar-empty">
                            该班级暂无已批改作业可聚合——请先在"名单/批改"中打分并发布成绩。
                        </div>
                    </div>
                </div>
                <!-- 知识点样本明细：教师据此判断各轴结论的置信度 -->
                <div class="card">
                    <div class="card-header bg-white">
                        <h2 class="h6 mb-0">知识点样本明细</h2>
                    </div>
                    <div class="card-body">
                        <div class="hw-table-wrap">
                            <table class="table table-sm table-hover align-middle mb-0">
                                <thead>
                                <tr>
                                    <th>知识点标签</th>
                                    <th>平均得分率</th>
                                    <th>已批改样本</th>
                                </tr>
                                </thead>
                                <tbody id="radar-tbody"></tbody>
                            </table>
                        </div>
                        <div class="hw-empty d-none" id="radar-table-empty">暂无可聚合的知识点数据。</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<!-- 图表页：withCharts=true，加载本地 ECharts -->
<th:block th:replace="~{fragments/layout :: scripts(true)}"></th:block>
<script>
    // 两个 ECharts 实例（窗口 resize 时统一重排）
    var trendChart = null;
    var radarChart = null;
    // 当前选中的班级ID（null 表示下拉尚未填充）
    var currentClazzId = null;

    $(function () {
        loadClazzOptions();
        $('#clazz-select').on('change', function () {
            currentClazzId = $(this).val() || null;
            loadDashboard();
        });
        $('#months-select').on('change', loadDashboard);
        $('#refresh-btn').on('click', loadDashboard);
        $(window).on('resize', function () {
            if (trendChart) { trendChart.resize(); }
            if (radarChart) { radarChart.resize(); }
        });
    });

    /** 班级下拉：GET /api/common/clazz/options（教师仅返回本人授课班级） */
    function loadClazzOptions() {
        HW.get('/api/common/clazz/options').done(function (list) {
            var $sel = $('#clazz-select').empty();
            if (!list || list.length === 0) {
                $sel.append('<option value="">（暂无授课班级）</option>');
                $('#trend-empty, #radar-empty, #radar-table-empty').removeClass('d-none');
                return;
            }
            $.each(list, function (i, c) {
                $sel.append('<option value="' + HW.esc(c.id) + '">' +
                    HW.esc(c.clazzName) + '（' + HW.esc(c.clazzCode) + '）</option>');
            });
            // 默认选中第一个班级并立即出图
            currentClazzId = String($sel.val());
            loadDashboard();
        });
    }

    /** 同时刷新趋势与雷达两个图表（同一班级，两个独立只读接口） */
    function loadDashboard() {
        if (!currentClazzId) { return; }
        loadTrend();
        loadRadar();
    }

    /** 趋势折线：GET /api/teacher/clazz/{clazzId}/trend?months=N */
    function loadTrend() {
        var months = $('#months-select').val() || '6';
        HW.get('/api/teacher/clazz/' + currentClazzId + '/trend', { months: months })
            .done(function (rows) {
                renderTrend(rows || []);
            });
    }

    /**
     * 渲染趋势图：左轴百分比（提交率/及格率），右轴平均分。
     * 后端对无成绩月份回 null，ECharts 遇 null 数据点自动断线，无需前端补数。
     */
    function renderTrend(rows) {
        if (rows.length === 0) {
            $('#trend-empty').removeClass('d-none');
            if (trendChart) { trendChart.dispose(); trendChart = null; }
            return;
        }
        $('#trend-empty').addClass('d-none');
        var el = document.getElementById('trend-chart');
        if (!trendChart) { trendChart = echarts.init(el); }
        var months = rows.map(function (r) { return r.statMonth; });
        trendChart.setOption($.extend(HW.chartBase(), {
            legend: { data: ['平均提交率(%)', '及格率(%)', '平均分'], top: 8, textStyle: { color: '#475569' } },
            xAxis: { type: 'category', data: months, axisLine: { lineStyle: { color: 'rgba(37,99,235,.15)' } }, axisTick: { show: false }, axisLabel: { color: '#64748b' } },
            yAxis: [
                { type: 'value', name: '百分比(%)', max: 100, minInterval: 10, axisLine: { show: false }, splitLine: { lineStyle: { color: 'rgba(37,99,235,.08)', type: 'dashed' } }, axisLabel: { color: '#64748b' } },
                { type: 'value', name: '平均分', splitLine: { show: false }, axisLine: { show: false }, axisLabel: { color: '#64748b' } }
            ],
            series: [
                { name: '平均提交率(%)', type: 'line', smooth: true, connectNulls: false,
                  data: rows.map(function (r) { return r.avgSubmitRate != null ? Number(r.avgSubmitRate) : null; }),
                  lineStyle: { color: '#3b82f6', width: 2.5 }, itemStyle: { color: '#3b82f6' } },
                { name: '及格率(%)', type: 'line', smooth: true, connectNulls: false,
                  data: rows.map(function (r) { return r.passRate != null ? Number(r.passRate) : null; }),
                  lineStyle: { color: '#16a34a', width: 2.5 }, itemStyle: { color: '#16a34a' } },
                { name: '平均分', type: 'line', smooth: true, connectNulls: false, yAxisIndex: 1,
                  data: rows.map(function (r) { return r.avgScore != null ? Number(r.avgScore) : null; }),
                  lineStyle: { color: '#dc2626', width: 2.5 }, itemStyle: { color: '#dc2626' } }
            ]
        }));
    }

    /** 雷达：GET /api/teacher/clazz/{clazzId}/radar（无已批改样本时为空列表） */
    function loadRadar() {
        HW.get('/api/teacher/clazz/' + currentClazzId + '/radar')
            .done(function (axes) {
                renderRadar(axes || []);
                renderRadarTable(axes || []);
            });
    }

    /** 渲染雷达图：indicator 固定 max=100（avgScoreRate 为百分制），轴名附带样本数 */
    function renderRadar(axes) {
        if (axes.length === 0) {
            $('#radar-empty').removeClass('d-none');
            if (radarChart) { radarChart.dispose(); radarChart = null; }
            return;
        }
        $('#radar-empty').addClass('d-none');
        var el = document.getElementById('radar-chart');
        if (!radarChart) { radarChart = echarts.init(el); }
        radarChart.setOption($.extend(HW.chartBase(), {
            tooltip: { trigger: 'item' },
            radar: {
                indicator: axes.map(function (a) {
                    // 轴名展示样本数，提醒教师小样本轴的结论仅供参考
                    return { name: a.knowledgeTag + ' (n=' + a.gradedCount + ')', max: 100 };
                }),
                radius: '65%',
                splitLine: { lineStyle: { color: 'rgba(37,99,235,.12)' } },
                axisLine: { lineStyle: { color: 'rgba(37,99,235,.18)' } },
                axisName: { color: '#64748b' },
                splitArea: { areaStyle: { color: ['rgba(255,255,255,.5)', 'rgba(243,246,252,.5)'] } }
            },
            series: [{
                type: 'radar',
                data: [{
                    name: '平均得分率',
                    value: axes.map(function (a) { return Number(a.avgScoreRate); }),
                    areaStyle: { color: 'rgba(59,130,246,0.18)' },
                    lineStyle: { color: '#3b82f6', width: 2 },
                    itemStyle: { color: '#3b82f6' }
                }]
            }]
        }));
    }

    /** 样本明细表：得分率低于 60% 的轴红色标注，帮助教师定位薄弱知识点 */
    function renderRadarTable(axes) {
        var $tbody = $('#radar-tbody').empty();
        $('#radar-table-empty').toggleClass('d-none', axes.length > 0);
        $.each(axes, function (i, a) {
            var rate = Number(a.avgScoreRate);
            var cls = rate < 60 ? 'text-danger fw-semibold' : 'text-success fw-semibold';
            $tbody.append('<tr>' +
                '<td><span class="badge bg-light text-dark border">' + HW.esc(a.knowledgeTag) + '</span></td>' +
                '<td><span class="' + cls + '">' + rate.toFixed(1) + '%</span></td>' +
                '<td><span class="small">' + HW.esc(a.gradedCount) + ' 份</span></td>' +
                '</tr>');
        });
    }
</script>
</body>
</html>
